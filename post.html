  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  <style>
    /* ---- Reading progress bar ---- */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent);
      z-index: 200;
      transition: width 0.1s linear;
    }

    /* ---- Post layout ---- */
    .post-page {
      padding-top: var(--nav-h);
      min-height: 100vh;
    }

    .post-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem 6rem;
    }

    /* ---- Back link ---- */
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 2.5rem 0 2rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      transition: color var(--transition), gap var(--transition);
    }
    .post-back:hover {
      color: var(--text-primary);
      gap: 12px;
    }
    .post-back svg { flex-shrink: 0; }

    /* ---- Post header ---- */
    .post-header {
      margin-bottom: 3rem;
      animation: fade-up 0.5s ease forwards;
    }

    .post-cats-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .post-cats-header .cat {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--accent);
      background: var(--accent-dim);
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      border: 1px solid rgba(45, 186, 106, 0.2);
    }

    .post-title-h1 {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.85rem;
      color: var(--text-primary);
    }

    .post-subtitle-p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .post-meta-bar {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .post-meta-bar .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .post-meta-bar svg { color: var(--text-muted); flex-shrink: 0; }

    /* ---- Cover image ---- */
    .post-cover {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin: 2rem 0;
      opacity: 0;
      animation: fade-in 0.6s ease 0.3s forwards;
    }
    .post-cover.hidden { display: none; }

    /* ---- Article body ---- */
    .post-body-content {
      opacity: 0;
      animation: fade-up 0.5s ease 0.2s forwards;
    }

    .post-body-content h1,
    .post-body-content h2,
    .post-body-content h3,
    .post-body-content h4 {
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text-primary);
      margin: 2.5rem 0 1rem;
    }

    .post-body-content h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .post-body-content h2 { font-size: 1.4rem; }
    .post-body-content h3 { font-size: 1.15rem; }
    .post-body-content h4 { font-size: 1rem; color: var(--text-secondary); }

    .post-body-content p {
      margin: 1rem 0;
      color: var(--text-secondary);
      line-height: 1.85;
      font-size: 1rem;
    }

    .post-body-content a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgba(45, 186, 106, 0.4);
      text-underline-offset: 3px;
      transition: text-decoration-color var(--transition), color var(--transition);
    }
    .post-body-content a:hover {
      text-decoration-color: var(--accent);
    }

    /* Code inline */
    .post-body-content code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      padding: 0.15em 0.45em;
      border-radius: 4px;
      color: #e0a875;
    }

    /* Code blocks */
    .post-body-content pre {
      margin: 1.75rem 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .post-body-content pre code {
      background: transparent;
      border: none;
      padding: 1.25rem 1.5rem;
      display: block;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.7;
      color: inherit;
    }

    /* Code block header (language label + copy button) */
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1rem;
    }
    .code-lang {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .code-copy {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: none;
      transition: all var(--transition);
    }
    .code-copy:hover { color: var(--text-primary); border-color: var(--border-hover); }
    .code-copy.copied { color: var(--accent); border-color: var(--accent); }

    /* Blockquotes */
    .post-body-content blockquote {
      margin: 1.75rem 0;
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-dim);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .post-body-content blockquote p {
      color: var(--text-primary);
      margin: 0;
      font-size: 0.95rem;
    }

    /* Lists */
    .post-body-content ul,
    .post-body-content ol {
      margin: 1rem 0 1rem 1.5rem;
      color: var(--text-secondary);
    }
    .post-body-content li {
      margin: 0.4rem 0;
      line-height: 1.75;
    }
    .post-body-content li::marker { color: var(--accent); }

    /* Horizontal rule */
    .post-body-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    /* Images */
    .post-body-content img {
      width: 100%;
      border-radius: var(--radius-md);
      margin: 1.5rem 0;
      border: 1px solid var(--border);
    }

    /* Tables */
    .post-body-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }
    .post-body-content th {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      font-weight: 600;
      text-align: left;
      padding: 0.65rem 1rem;
      border-bottom: 2px solid var(--border);
    }
    .post-body-content td {
      padding: 0.6rem 1rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    .post-body-content tr:last-child td { border-bottom: none; }
    .post-body-content tr:hover td { background: rgba(255,255,255,0.02); }

    /* Strong */
    .post-body-content strong { color: var(--text-primary); font-weight: 600; }

    /* ---- Callout / Note boxes (Notion-style > [!NOTE] ) ---- */
    .callout {
      display: flex;
      gap: 0.75rem;
      margin: 1.75rem 0;
      padding: 1rem 1.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid;
    }
    .callout-note {
      background: rgba(59, 130, 246, 0.08);
      border-color: rgba(59, 130, 246, 0.25);
    }
    .callout-warning {
      background: rgba(234, 179, 8, 0.08);
      border-color: rgba(234, 179, 8, 0.25);
    }
    .callout-tip {
      background: rgba(45, 186, 106, 0.08);
      border-color: rgba(45, 186, 106, 0.25);
    }
    .callout-caution {
      background: rgba(249, 115, 22, 0.08);
      border-color: rgba(249, 115, 22, 0.25);
    }
    .callout-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .callout-body { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
    .callout-body p { margin: 0; color: inherit; }
    .callout-body > * + * { margin-top: 0.6rem; }
    .callout-body strong { color: var(--text-primary); }
    .callout-body .callout-title { font-weight: 600; color: var(--text-primary); }
    .callout-body pre { margin: 0.75rem 0 0; }
    .callout-body img { margin: 0.75rem 0 0; }
    details.callout { display: block; }
    details.callout summary {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      cursor: pointer;
      list-style: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    details.callout summary::-webkit-details-marker { display: none; }
    details.callout summary::after { content: '▸'; margin-left: auto; color: var(--text-muted); transition: transform var(--transition); }
    details.callout[open] summary::after { transform: rotate(90deg); }
    details.callout > .callout-body { margin-top: 0.85rem; }

    /* Figures with caption */
    .post-figure { margin: 1.5rem 0; }
    .post-body-content .post-figure img { margin: 0; }
    .post-figure figcaption {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    /* Math */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }

    /* Notebook outputs */
    .nb-output { overflow-x: auto; margin: 1rem 0 1.5rem; }
    .post-body-content .nb-output table { width: auto; font-size: 0.78rem; margin: 0; }
    .post-body-content .nb-output th,
    .post-body-content .nb-output td { padding: 0.35rem 0.75rem; white-space: nowrap; }
    .nb-plot {
      display: block;
      width: 100%;
      height: 560px;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
    }
    .nb-audio { display: block; width: 100%; margin: 1rem 0 1.5rem; }

    /* ---- Post footer ---- */
    .post-footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .post-footer-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: color var(--transition);
    }
    .post-footer-back:hover { color: var(--text-primary); }

    /* ---- Loading / Error states ---- */
    .post-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      color: var(--text-muted);
    }
    .post-loading-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .post-error {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }
    .post-error h2 { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--text-primary); }

    /* ---- Badges (shields.io) ---- */
    .post-body-content img[src*="badge"],
    .post-body-content img[src*="shields.io"],
    .post-body-content img[src*="fury.io"] {
      display: inline;
      width: auto;
      margin: 0 0.25rem 0 0;
      border: none;
      border-radius: 3px;
      vertical-align: middle;
    }
  </style>

  <script>
    /* ==================================================
       POST PAGE — loads markdown, renders it beautifully
    ================================================== */

    const container = document.getElementById('post-container');
    const progressBar = document.getElementById('progress-bar');

    // ---- Reading progress ----
    window.addEventListener('scroll', () => {
      const total   = document.body.scrollHeight - window.innerHeight;
      const current = window.scrollY;
      progressBar.style.width = total > 0 ? `${(current / total) * 100}%` : '0%';
    }, { passive: true });

    // ---- Slugify util ----
    function readingTime(text) {
      const wpm   = 200;
      const words = text.trim().split(/\s+/).length;
      return Math.max(1, Math.ceil(words / wpm));
    }

    // ---- Parse frontmatter ----
    function parseFrontmatter(raw) {
      const fm = {};
      if (!raw.startsWith('---')) return { fm, body: raw };

      const end = raw.indexOf('---', 3);
      if (end === -1) return { fm, body: raw };

      const block = raw.slice(3, end).trim();
      let body    = raw.slice(end + 3).trim();

      block.split('\n').forEach(line => {
        const colon = line.indexOf(':');
        if (colon < 0) return;
        const key = line.slice(0, colon).trim();
        let   val = line.slice(colon + 1).trim();

        // Handle list syntax: [a, b, c]
        if (val.startsWith('[') && val.endsWith(']')) {
          val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
        } else {
          val = val.replace(/^["']|["']$/g, '');
        }
        fm[key] = val;
      });

      return { fm, body };
    }

    // ---- Format date ----
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('es-ES', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      } catch { return dateStr; }
    }

    // ---- Configure marked.js ----
    const slugBase = getSlugFromURL();
    const postDir  = slugBase ? `posts/${slugBase}/` : '';

    // Custom image renderer to fix relative paths
    const renderer = new marked.Renderer();
    renderer.image = function(href, title, text) {
      // Fix relative image paths to be relative to post folder
      let src = href;
      if (src && !src.startsWith('http') && !src.startsWith('//') && !src.startsWith('data:')) {
        src = `../${postDir}${src}`;
      }
      // Detect badge images
      const isBadge = src.includes('badge') || src.includes('shields.io') || src.includes('fury.io') || src.includes('img.shields');
      if (isBadge) {
        return `<img src="${src}" alt="${text || ''}" style="display:inline;width:auto;border:none;margin:0 3px 0 0;border-radius:3px;vertical-align:middle" />`;
      }
      const img = `<img src="${src}" alt="${text || ''}" title="${title || ''}" loading="lazy" />`;
      if (!text) return img;
      // Alt text doubles as the caption (as Quarto/Notion showed it)
      const caption = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return `<figure class="post-figure">${img}<figcaption>${caption}</figcaption></figure>`;
    };

    // A paragraph holding only a figure shouldn't be wrapped in <p>
    renderer.paragraph = function(text) {
      const t = text.trim();
      if (/^<figure[\s\S]*<\/figure>$/.test(t) && t.indexOf('<figure', 1) === -1) return t + '\n';
      return `<p>${text}</p>\n`;
    };

    // Custom code block renderer with header
    renderer.code = function(code, language) {
      const lang    = language || 'text';
      const hl      = (hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang }) : hljs.highlightAuto(code)).value;
      const escapedCode = code.replace(/"/g, '&quot;');
      return `<pre><div class="code-header"><span class="code-lang">${lang}</span><button class="code-copy" onclick="copyCode(this, &quot;${escapedCode.replace(/\n/g,'\\n')}&quot;)" aria-label="Copy code">Copy</button></div><code class="hljs language-${lang}">${hl}</code></pre>`;
    };

    // Custom blockquote — callouts:
    //   > [!NOTE]            default icon
    //   > [!NOTE] 🤖         custom icon
    //   > [!NOTE] 📝 Nota    custom icon + title
    //   > [!CAUTION]- Título  collapsible (closed by default)
    const calloutMap = {
      NOTE:      { cls: 'callout-note',    icon: '📝' },
      TIP:       { cls: 'callout-tip',     icon: '💡' },
      WARNING:   { cls: 'callout-warning', icon: '⚠️' },
      CAUTION:   { cls: 'callout-caution', icon: '🔥' },
      IMPORTANT: { cls: 'callout-note',    icon: 'ℹ️' },
    };
    renderer.blockquote = function(quote) {
      const m = /^\s*<p>\[!(NOTE|TIP|WARNING|CAUTION|IMPORTANT)\](-?)[ \t]*([^\n]*?)(\n|<\/p>)/.exec(quote);
      if (!m) return `<blockquote>${quote}</blockquote>`;
      const { cls, icon: defaultIcon } = calloutMap[m[1]];
      let body = quote.slice(m[0].length).trim();
      if (m[4] === '\n') body = '<p>' + body;
      const em = /^((?:\p{Extended_Pictographic}|\p{Emoji_Modifier}|‍|️)+)\s*(.*)$/u.exec(m[3].trim());
      const icon  = em ? em[1] : defaultIcon;
      const title = em ? em[2] : m[3].trim();
      if (m[2]) {
        return `<details class="callout ${cls}"><summary><span class="callout-icon">${icon}</span><span>${title || 'Ver más'}</span></summary><div class="callout-body">${body}</div></details>`;
      }
      const titleHtml = title ? `<p class="callout-title">${title}</p>` : '';
      return `<div class="callout ${cls}"><span class="callout-icon">${icon}</span><div class="callout-body">${titleHtml}${body}</div></div>`;
    };

    // Math: $$...$$ blocks and $...$ inline, rendered with KaTeX
    function renderMath(tex, displayMode) {
      try { return katex.renderToString(tex, { displayMode, throwOnError: false }); }
      catch { return tex; }
    }
    const mathExtensions = [
      {
        name: 'mathBlock',
        level: 'block',
        start(src) { const m = /(^|\n) {0,3}\$\$/.exec(src); return m ? m.index + m[1].length : undefined; },
        tokenizer(src) {
          const m = /^ {0,3}\$\$([\s\S]+?)\$\$[ \t]*(?:\n|$)/.exec(src);
          if (m) return { type: 'mathBlock', raw: m[0], text: m[1].trim() };
        },
        renderer(token) { return renderMath(token.text, true) + '\n'; },
      },
      {
        name: 'mathInline',
        level: 'inline',
        start(src) { const i = src.indexOf('$'); return i < 0 ? undefined : i; },
        tokenizer(src) {
          let m = /^\$\$([^$]+?)\$\$/.exec(src);
          if (m) return { type: 'mathInline', raw: m[0], text: m[1].trim(), display: true };
          m = /^\$(?!\s)((?:\\.|[^\\$\n])+?)(?<!\s)\$(?!\d)/.exec(src);
          if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: false };
        },
        renderer(token) { return renderMath(token.text, token.display); },
      },
    ];

    marked.use({ renderer, extensions: mathExtensions });

    // ---- Get slug from URL ----
    function getSlugFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('slug') || '';
    }

    // ---- Copy code helper ----
    window.copyCode = function(btn, code) {
      const decoded = code.replace(/\\n/g, '\n');
      navigator.clipboard.writeText(decoded).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    };

    // ---- Main render ----
    async function loadPost() {
      const slug = getSlugFromURL();
      if (!slug) { showError('No post specified.'); return; }

      // First, try to get metadata from posts.json
      let meta = null;
      try {
        const res  = await fetch('../posts/posts.json');
        const list = await res.json();
        meta = list.find(p => p.slug === slug) || null;
      } catch (e) { /* no meta, continue */ }

      // Fetch markdown
      let raw = '';
      try {
        const mdRes = await fetch(`../posts/${slug}/index.md`);
        if (!mdRes.ok) throw new Error('Not found');
        raw = await mdRes.text();
      } catch (e) {
        showError(`Could not load post "<strong>${slug}</strong>".`);
        return;
      }

      // Parse frontmatter (takes priority over posts.json)
      const { fm, body } = parseFrontmatter(raw);

      // Merge: frontmatter overrides posts.json
      const title      = fm.title      || meta?.title      || slug;
      const subtitle   = fm.subtitle   || meta?.subtitle   || '';
      const date       = fm.date       || meta?.date       || '';
      const author     = fm.author     || meta?.author     || 'Diegulio';
      const categories = fm.categories || meta?.categories || [];
      const image      = fm.image      || meta?.image      || '';

      // Update page title & meta
      document.title = `${title} — Diegulio`;
      document.querySelector('meta[name="description"]').content = subtitle;

      // Reading time
      const rt = readingTime(body);

      // Build cats HTML
      const catsHtml = Array.isArray(categories)
        ? categories.map(c => `<span class="cat">${c}</span>`).join('')
        : '';

      // Render markdown body
      const htmlBody = marked.parse(body);

      // Inject post HTML
      container.innerHTML = `
        <a href="../index.html#blog" class="post-back" id="post-back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/>
          </svg>
          Volver al blog
        </a>

        <header class="post-header">
          <div class="post-cats-header">${catsHtml}</div>
          <h1 class="post-title-h1">${title}</h1>
          ${subtitle ? `<p class="post-subtitle-p">${subtitle}</p>` : ''}
          <div class="post-meta-bar">
            ${author ? `
              <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                ${author}
              </span>` : ''}
            ${date ? `
              <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${formatDate(date)}
              </span>` : ''}
            <span class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${rt} min de lectura
            </span>
          </div>
        </header>

        ${image ? `<img src="${image}" alt="${title}" class="post-cover" id="post-cover-img" loading="eager" onerror="this.classList.add('hidden')" />` : ''}

        <article class="post-body-content" id="post-article">
          ${htmlBody}
        </article>

        <footer class="post-footer">
          <a href="../index.html#blog" class="post-footer-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 5 5 12 12 19"/>
            </svg>
            Todos los posts
          </a>
          <span style="font-size:0.75rem;font-family:var(--font-mono);color:var(--text-muted)">diegulio 🧡</span>
        </footer>
      `;
    }

    function showError(msg) {
      container.innerHTML = `
        <div class="post-error">
          <h2>Post no encontrado</h2>
          <p style="margin:0.5rem 0 1.5rem;color:var(--text-muted)">${msg}</p>
          <a href="../index.html#blog" class="btn btn-ghost">← Volver al blog</a>
        </div>`;
    }

    loadPost();
  </script>
</body>
</html>
